<style>
:root{
  --bg:#ffffff; --panel:#f6f7f9; --panel2:#edeff3; --text:#14161a; --muted:#6b7280;
  --accent:#0d9488; --danger:#dc2626; --good:#16a34a; --border:#e3e5ea;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none; touch-action:manipulation;
}
#app{position:fixed; inset:0; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
.view{flex:1; min-height:0; display:none; flex-direction:column;}
.view.active{display:flex;}

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border);
  background:var(--panel); flex-shrink:0;
}
.topbar h1{font-size:17px; margin:0; font-weight:700; flex:1; text-align:center;}
.iconbtn{
  width:36px; height:36px; border-radius:10px; border:none; background:var(--panel2); color:var(--text);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.iconbtn:active{opacity:.6;}
.topbar .spacer{width:36px; flex-shrink:0;}

/* ---------- home ---------- */
.home-scroll{flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch;}
.home-title{font-size:26px; font-weight:800; margin:6px 0 18px;}
.line-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:12px; margin-bottom:26px;}
.bullet{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:22px; border:none; cursor:pointer; margin:0 auto;
}
.bullet:active{transform:scale(.93);}
.section-label{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px;}
.shuttle-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
.shuttle-item{display:flex; flex-direction:column; align-items:center; gap:6px; width:80px;}
.shuttle-item span{font-size:12px; color:var(--muted); text-align:center;}
.progress-card{
  background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:22px;
  display:flex; align-items:center; gap:14px; cursor:pointer;
}
.progress-card .ring{width:52px; height:52px; border-radius:50%; flex-shrink:0;}
.progress-card .pc-text{flex:1;}
.progress-card .pc-title{font-weight:700; font-size:15px;}
.progress-card .pc-sub{color:var(--muted); font-size:13px; margin-top:2px;}

/* ---------- line view ---------- */
.line-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 0 100px;}
.trunk-col{display:flex; flex-direction:column; align-items:stretch;}
.fork-row{display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity; gap:0; width:100%;}
.branch-col{display:flex; flex-direction:column; flex:0 0 88%; max-width:420px; scroll-snap-align:start; padding:0 14px; border-left:2px dashed var(--border); margin-left:8px;}
.fork-row .branch-col:first-child{border-left:2px dashed var(--border);}
.fork-hint{font-size:11px; color:var(--muted); text-align:center; padding:4px 0 10px; letter-spacing:.04em;}

.station-row{
  display:flex; align-items:center; gap:12px; padding:10px 18px; min-height:44px; position:relative; cursor:pointer;
}
.station-row .dot{width:14px; height:14px; border-radius:50%; flex-shrink:0; border:3px solid var(--bg); box-shadow:0 0 0 1.5px currentColor;}
.station-row .line{position:absolute; left:24px; top:-2px; bottom:-2px; width:3px; z-index:0;}
.station-row .name{font-size:15.5px; font-weight:600; flex:1; z-index:1;}
.station-row .blank{flex:1; height:2px; border-radius:2px; background:var(--border); margin-right:6px;}
.station-row.filled .name{color:var(--good);}
.station-row.missed .name{color:var(--danger);}
.station-row.active{background:rgba(13,148,136,.10); border-radius:10px;}
.station-row.active .name, .station-row.active .blank{outline:none;}

.bottombar{
  position:absolute; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 60%, transparent); display:flex; justify-content:center;
}
.testbtn{
  border:none; border-radius:999px; padding:14px 40px; font-size:17px;
  font-weight:800; box-shadow:0 6px 18px rgba(0,0,0,.18);
}
.testbtn:active{transform:scale(.96);}

/* ---------- test mode ---------- */
.test-header{padding:10px 14px 4px; display:flex; align-items:center; gap:10px; flex-shrink:0;}
.stopwatch{font-variant-numeric:tabular-nums; font-size:20px; font-weight:800; letter-spacing:.02em;}
.test-header .grow{flex:1;}
.endbtn{background:var(--danger); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-weight:700; font-size:14px;}
.endbtn:active{opacity:.7;}
.typebar{
  padding:8px 14px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:var(--panel);
  display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.typebar input{
  flex:1; background:var(--panel2); border:1px solid var(--border); border-radius:12px; color:var(--text);
  padding:12px 14px; font-size:16px; outline:none;
}
.typebar input:focus{border-color:var(--accent);}
.typebar .target-hint{font-size:12px; color:var(--muted); padding:0 14px 6px;}

/* ---------- overlay ---------- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:24px;}
.overlay.active{display:flex;}
.overlay-card{background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:26px 22px; max-width:340px; width:100%; text-align:center;}
.overlay-card .emoji{font-size:40px; margin-bottom:8px;}
.overlay-card h2{margin:0 0 6px; font-size:20px;}
.overlay-card .stat{font-size:15px; color:var(--muted); margin:4px 0;}
.overlay-card .stat b{color:var(--text);}
.overlay-card .actions{display:flex; gap:10px; margin-top:18px;}
.overlay-card button{flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; font-size:14px;}
.btn-primary{background:var(--accent); color:#ffffff;}
.btn-secondary{background:var(--panel2); color:var(--text);}

/* ---------- progress ---------- */
.progress-scroll{flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch;}
.overall-box{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; text-align:center; margin-bottom:20px;}
.overall-box .big{font-size:38px; font-weight:800; color:var(--accent);}
.overall-box .lbl{color:var(--muted); font-size:13px; margin-top:4px;}
.pl-row{display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid var(--border);}
.pl-row .bullet{width:38px; height:38px; font-size:15px;}
.pl-row .pl-info{flex:1;}
.pl-row .pl-name{font-weight:700; font-size:14.5px;}
.pl-row .pl-sub{color:var(--muted); font-size:12.5px; margin-top:2px;}
.pl-row .pl-status{font-size:12px; padding:5px 10px; border-radius:999px; background:var(--panel2); color:var(--muted); flex-shrink:0;}
.pl-row .pl-status.done{background:rgba(22,163,74,.15); color:var(--good);}

/* ---------- home grid v2 (color-grouped, includes shuttles) ---------- */
.grid-item{display:flex; flex-direction:column; align-items:center; gap:5px;}
.grid-item-label{font-size:9.5px; color:var(--muted); text-align:center; line-height:1.15; min-height:23px; max-width:66px;}

/* ---------- inline test input ---------- */
.station-row input.inline-input{
  flex:1; min-width:0; background:transparent; border:none; border-bottom:2px solid var(--accent);
  color:var(--text); font-size:15.5px; font-weight:600; font-family:inherit; padding:4px 2px; outline:none;
}
.station-row input.inline-input::placeholder{color:var(--muted); font-weight:400;}

/* ---------- borough border markers ---------- */
.border-divider{display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 18px;}
.border-divider .boro{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); white-space:nowrap; font-weight:700;}
.border-divider .boro-line{width:64%; max-width:240px; height:1px; background:repeating-linear-gradient(to right, var(--border) 0 4px, transparent 4px 8px);}

/* ---------- system select ---------- */
.sys-grid{display:flex; flex-direction:column; gap:16px; padding-top:6px;}
.sys-card{
  display:flex; flex-direction:column; align-items:center; gap:12px; background:var(--panel);
  border:1px solid var(--border); border-radius:22px; padding:26px 20px; cursor:pointer;
}
.sys-card:active{transform:scale(.98);}
.sys-logo{height:64px; max-width:78%; object-fit:contain;}
.sys-name{font-weight:800; font-size:16px;}
.sys-progress-track{width:100%; height:9px; border-radius:999px; background:var(--panel2); overflow:hidden;}
.sys-progress-fill{height:100%; border-radius:999px; background:var(--accent);}
.sys-progress-label{font-size:12px; color:var(--muted);}

</style>
</head>
<body>
<div id="app">

  <!-- SYSTEM SELECT -->
  <div class="view active" id="view-systems">
    <div class="topbar"><div class="spacer"></div><h1>Transit Memory</h1><div class="spacer"></div></div>
    <div class="home-scroll">
      <div class="sys-grid" id="systems-grid"></div>
    </div>
  </div>

  <!-- LINE GRID (per system) -->
  <div class="view" id="view-home">
    <div class="topbar">
      <button class="iconbtn" id="home-back-btn">‹</button>
      <h1 id="home-title">Lines</h1>
      <div class="spacer"></div>
    </div>
    <div class="home-scroll">
      <div class="progress-card" id="home-progress-card">
        <div class="ring" id="home-progress-ring"></div>
        <div class="pc-text">
          <div class="pc-title" id="home-progress-pct">0%</div>
          <div class="pc-sub">of all stops memorized — tap for details</div>

/* ============ fuzzy matching ============ */
function normalize(s){
  if(!s) return '';
  s = s.toLowerCase();
  s = s.replace(/(\d+)(st|nd|rd|th)\b/g, '$1');
  s = s.replace(/['’]/g, '');
  s = s.replace(/[\/\-–—(),.]/g, ' ');
  s = s.replace(/\beast\b/g,'e').replace(/\bwest\b/g,'w').replace(/\bnorth\b/g,'n').replace(/\bsouth\b/g,'s');
  s = s.replace(/\bavenues\b/g,'avs').replace(/\bavenue\b/g,'av').replace(/\bave\b/g,'av');
  s = s.replace(/\bstreets\b/g,'sts').replace(/\bstreet\b/g,'st');
  s = s.replace(/\bboulevard\b/g,'blvd');
  s = s.replace(/\bsquare\b/g,'sq');
  s = s.replace(/\bparkway\b/g,'pkwy');
  s = s.replace(/\bplace\b/g,'pl');
  s = s.replace(/\broad\b/g,'rd');
  s = s.replace(/\bdrive\b/g,'dr');
  s = s.replace(/\bheights\b/g,'hts');
  s = s.replace(/\bcentre\b/g,'ctr').replace(/\bcenter\b/g,'ctr');
  s = s.replace(/\bterminal\b/g,'term');
  s = s.replace(/\bjunction\b/g,'jct');
  s = s.replace(/\bfort\b/g,'ft');
  s = s.replace(/\bmount\b/g,'mt');
  s = s.replace(/\s+/g,' ').trim();
  return s;
}
function isCorrect(input, name){
  const n = normalize(input);
  if(!n) return false;
  return n === normalize(name);
}

/* ============ tree flatten / render helpers ============ */
function forEachStop(segments, cb){
  segments.forEach(seg=>{
    if(seg.type==='trunk'){ seg.stops.forEach(s=>cb(s)); }
    else { seg.branches.forEach(b=> forEachStop(b, cb)); }
  });
}
function lineStopCount(sys, lineId){
  let n=0; forEachStop(SYSTEMS[sys].lines[lineId].segments, ()=>n++); return n;
}
function systemStopCount(sys){
  let n=0; SYSTEMS[sys].order.forEach(id=> n += lineStopCount(sys,id)); return n;
}

/* ============ progress storage ============ */
const PROG_KEY = 'subwayMemProgress_v2';
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROG_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }
function recKey(sys, lineId){ return sys+':'+lineId; }
function getLineRecord(sys, lineId){
  const p = loadProgress();
  return p[recKey(sys,lineId)] || {completed:false, bestTime:null, bestFilled:0};
}
function updateLineRecord(sys, lineId, filledCount, totalCount, elapsedMs){
  const p = loadProgress();
  const k = recKey(sys,lineId);
  const rec = p[k] || {completed:false, bestTime:null, bestFilled:0};
  if(filledCount >= totalCount){
    rec.completed = true;
    if(rec.bestTime===null || elapsedMs < rec.bestTime) rec.bestTime = elapsedMs;
    rec.bestFilled = totalCount;
  } else {
    if(filledCount > rec.bestFilled) rec.bestFilled = filledCount;
  }
  p[k] = rec;
  saveProgress(p);
  return rec;
}
function overallStats(sys){
  const p = loadProgress();
  let total=0, done=0;
  SYSTEMS[sys].order.forEach(id=>{
    const c = lineStopCount(sys,id);
    total += c;
    const rec = p[recKey(sys,id)];
    if(rec && rec.completed) done += c;
  });
  return {done, total, pct: total? Math.round(done/total*100):0};
}

/* ============ formatting ============ */
function fmtTime(ms){
  const totalSec = Math.floor(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function lineLabel(sys, lineId){
  const L = SYSTEMS[sys].lines[lineId];
  return L.fullName ? (L.name+' — '+L.fullName) : (L.name+' Train');
}

/* ============ app state / router ============ */
let testState = null; // {sys, lineId, flat:[{name,el}], filled:Set, current:idx, startTime, timer}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text!==undefined) e.textContent = text;
  return e;
}

function route(){
  const hash = location.hash || '#/';
  stopTimerIfLeavingTest(hash);
  const views = document.querySelectorAll('.view');
  views.forEach(v=>v.classList.remove('active'));
  const parts = hash.replace(/^#\//,'').split('/').filter(x=>x.length).map(decodeURIComponent);
  if(parts.length===0){
    document.getElementById('view-systems').classList.add('active');
    renderSystems();
  } else if(parts[0]==='lines' && parts[1]){
    document.getElementById('view-home').classList.add('active');
    renderHome(parts[1]);
  } else if(parts[0]==='line' && parts[1] && parts[2]){
    document.getElementById('view-line').classList.add('active');
    renderLineBrowse(parts[1], parts[2]);
  } else if(parts[0]==='test' && parts[1] && parts[2]){
    document.getElementById('view-test').classList.add('active');
    startTest(parts[1], parts[2]);
  } else if(parts[0]==='progress' && parts[1]){
    document.getElementById('view-progress').classList.add('active');
    renderProgress(parts[1]);
  } else {
    document.getElementById('view-systems').classList.add('active');
    renderSystems();
  }
}
function stopTimerIfLeavingTest(newHash){
  if(testState && testState.timer && !newHash.startsWith('#/test/')){
    clearInterval(testState.timer);
    testState.timer = null;
  }
}
window.addEventListener('hashchange', route);

/* ============ SYSTEM SELECT ============ */
function renderSystems(){
  const wrap = document.getElementById('systems-grid');
  wrap.innerHTML = '';
  Object.keys(SYSTEMS).forEach(sys=>{
    const S = SYSTEMS[sys];
    const stats = overallStats(sys);
    const card = el('div','sys-card');
    const img = document.createElement('img');
    img.className = 'sys-logo';
    img.src = S.logo;
    img.alt = S.name;
    card.appendChild(img);
    card.appendChild(el('div','sys-name', S.name));
    const track = el('div','sys-progress-track');
    const fill = el('div','sys-progress-fill');
    fill.style.width = stats.pct+'%';
    track.appendChild(fill);
    card.appendChild(track);
    card.appendChild(el('div','sys-progress-label', stats.pct+'% memorized'));
    card.onclick = ()=>{ location.hash = '#/lines/'+sys; };
    wrap.appendChild(card);
  });
}

/* ============ LINE GRID (per system) ============ */
function renderHome(sys){
  const S = SYSTEMS[sys];
  document.getElementById('home-title').textContent = S.name;
  const grid = document.getElementById('home-line-grid');
  grid.innerHTML = '';
  S.order.forEach(id=>{
    const L = S.lines[id];
    const wrap = el('div','grid-item');
    const b = el('button','bullet',L.name);
    b.style.background = L.color; b.style.color = L.textColor;
    if(L.name.length > 1) b.style.fontSize = '50%';
    b.onclick = ()=>{ location.hash = '#/line/'+sys+'/'+id; };
    wrap.appendChild(b);
    wrap.appendChild(el('span','grid-item-label', L.fullName ? L.fullName : ''));
    grid.appendChild(wrap);
  });
  const stats = overallStats(sys);
  const card = document.getElementById('home-progress-card');
  card.onclick = ()=>{ location.hash='#/progress/'+sys; };
  document.getElementById('home-progress-pct').textContent = stats.pct+'%';
  document.getElementById('home-progress-ring').style.background =
    `conic-gradient(var(--accent) ${stats.pct*3.6}deg, var(--panel2) 0deg)`;
  document.getElementById('home-back-btn').onclick = ()=>{ location.hash = '#/'; };
}

/* ============ LINE BROWSE ============ */
function renderLineBrowse(sys, lineId){
  const L = SYSTEMS[sys].lines[lineId];
  document.getElementById('line-title').textContent = lineLabel(sys, lineId);
  const scroll = document.getElementById('line-scroll');
  scroll.innerHTML = '';
  const root = el('div','trunk-col');
  buildBrowseSegments(L.segments, root, L, sys, lineId);
  scroll.appendChild(root);
  const testBtn = document.getElementById('line-test-btn');
  testBtn.style.background = L.color;
  testBtn.style.color = L.textColor;
  testBtn.onclick = ()=>{ location.hash = '#/test/'+sys+'/'+lineId; };
  document.getElementById('line-back-btn').onclick = ()=>{ location.hash = '#/lines/'+sys; };
  document.getElementById('line-home-btn').onclick = ()=>{ location.hash = '#/'; };
}
function buildBrowseSegments(segments, container, L, sys, lineId){
  segments.forEach(seg=>{
    if(seg.type==='trunk'){
      seg.stops.forEach((name,idx)=>{
        container.appendChild(makeStationRow(name, L, false));
        if(idx < seg.stops.length-1){
          const b = borderBetween(sys, lineId, name, seg.stops[idx+1]);
          if(b) container.appendChild(makeBorderDivider(b));
        }
      });
    } else {
      const hint = el('div','fork-hint','⟷ swipe to see other branches');
      container.appendChild(hint);
      const forkRow = el('div','fork-row');
      seg.branches.forEach(branchSegs=>{
        const col = el('div','branch-col');
        buildBrowseSegments(branchSegs, col, L, sys, lineId);
        forkRow.appendChild(col);
      });
      container.appendChild(forkRow);
    }
  });
}
function makeStationRow(name, L, testMode){
  const row = el('div','station-row');
  const bar = el('div',null); bar.className='line'; bar.style.background = L.color; bar.style.color = L.color;
  const dot = el('div','dot'); dot.style.background = L.color; dot.style.color = L.color;
  row.appendChild(bar); row.appendChild(dot);
  if(testMode){
    const blank = el('div','blank');
    row.appendChild(blank);
    row._blank = blank;
  } else {
    row.appendChild(el('div','name',name));
  }
  return row;
}

/* ============ TEST MODE ============ */
function startTest(sys, lineId){
  if(testState && testState.timer) clearInterval(testState.timer);
  const L = SYSTEMS[sys].lines[lineId];
  document.getElementById('test-title').textContent = lineLabel(sys, lineId);
  const scroll = document.getElementById('test-scroll');
  scroll.innerHTML = '';
  const flat = [];
  const root = el('div','trunk-col');
  buildTestSegments(L.segments, root, L, flat, sys, lineId);
  scroll.appendChild(root);

  testState = {
    sys, lineId, flat, filled: new Set(), current: 0,
    startTime: Date.now(), timer: null, inputEl: null, inputRowIndex: null
  };
  flat.forEach((f,i)=>{
    f.row.onclick = ()=>{
      if(i !== testState.current && !testState.filled.has(i)) setCursor(i);
    };
  });
  setCursor(0);
  document.getElementById('test-end-btn').onclick = endTest;
  document.getElementById('test-home-btn').onclick = ()=>{ location.hash = '#/'; };
  document.getElementById('stopwatch').textContent = '0:00';
  testState.timer = setInterval(()=>{
    document.getElementById('stopwatch').textContent = fmtTime(Date.now()-testState.startTime);
  }, 250);
}
function buildTestSegments(segments, container, L, flat, sys, lineId){
  segments.forEach(seg=>{
    if(seg.type==='trunk'){
      seg.stops.forEach((name,idx)=>{
        const row = makeStationRow(name, L, true);
        container.appendChild(row);
        flat.push({name, row, blank:row._blank});
        if(idx < seg.stops.length-1){
          const b = borderBetween(sys, lineId, name, seg.stops[idx+1]);
          if(b) container.appendChild(makeBorderDivider(b));
        }
      });
    } else {
      const hint = el('div','fork-hint','⟷ swipe to see other branches');
      container.appendChild(hint);
      const forkRow = el('div','fork-row');
      seg.branches.forEach(branchSegs=>{
        const col = el('div','branch-col');
        buildTestSegments(branchSegs, col, L, flat, sys, lineId);
        forkRow.appendChild(col);
      });
      container.appendChild(forkRow);
    }
  });
}
function mountInputAt(i){
  // unmount existing input, restoring a blank placeholder to its old row
  if(testState.inputEl){
    const oldF = testState.flat[testState.inputRowIndex];
    testState.inputEl.remove();
    if(oldF && !testState.filled.has(testState.inputRowIndex)){
      const blank = el('div','blank');
      oldF.row.appendChild(blank);
      oldF.blank = blank;
    }
  }
  testState.inputEl = null; testState.inputRowIndex = null;
  if(i >= testState.flat.length) return;
  const f = testState.flat[i];
  if(testState.filled.has(i)) return;
  if(f.blank){ f.blank.remove(); f.blank = null; }
  const input = el('input','inline-input');
  input.type = 'text';
  input.autocomplete = 'off'; input.autocapitalize='off'; input.autocorrect='off'; input.spellcheck=false;
  input.placeholder = 'Type station name…';
  input.oninput = onTypeInput;
  f.row.appendChild(input);
  testState.inputEl = input;
  testState.inputRowIndex = i;
  setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 60);
}
function setCursor(i){
  if(!testState) return;
  testState.flat.forEach(f=>f.row.classList.remove('active'));
  testState.current = i;
  mountInputAt(i);
  if(i < testState.flat.length){
    const f = testState.flat[i];
    f.row.classList.add('active');
    f.row.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
  }
}
function onTypeInput(e){
  if(!testState) return;
  const i = testState.current;
  if(i>=testState.flat.length) return;
  const target = testState.flat[i];
  if(isCorrect(e.target.value, target.name)){
    fillStation(i);
    advanceCursor();
  }
}
function fillStation(i){
  const f = testState.flat[i];
  if(testState.filled.has(i)) return;
  testState.filled.add(i);
  f.row.classList.add('filled');
  if(testState.inputRowIndex === i && testState.inputEl){
    testState.inputEl.remove();
    testState.inputEl = null; testState.inputRowIndex = null;
  }
  if(f.blank){ f.blank.remove(); f.blank = null; }
  f.row.appendChild(el('div','name',f.name));
}
function advanceCursor(){
  let n = testState.current + 1;
  while(n < testState.flat.length && testState.filled.has(n)) n++;
  if(n >= testState.flat.length && testState.filled.size >= testState.flat.length){
    finishTest(true);
    return;
  }
  setCursor(Math.min(n, testState.flat.length));
}
function endTest(){ finishTest(false); }
function finishTest(completedAll){
  if(!testState) return;
  if(testState.timer){ clearInterval(testState.timer); testState.timer=null; }
  const elapsed = Date.now() - testState.startTime;
  if(testState.inputEl){ testState.inputEl.remove(); testState.inputEl=null; testState.inputRowIndex=null; }
  // reveal missed stations
  testState.flat.forEach((f,idx)=>{
    if(!testState.filled.has(idx)){
      f.row.classList.add('missed');
      if(f.blank){ f.blank.remove(); f.blank=null; }
      f.row.appendChild(el('div','name',f.name));
    }
  });
  const filledCount = testState.filled.size;
  const total = testState.flat.length;
  const rec = updateLineRecord(testState.sys, testState.lineId, filledCount, total, elapsed);
  const pct = Math.round(filledCount/total*100);
  showEndOverlay(completedAll, filledCount, total, pct, elapsed, rec);
}
function showEndOverlay(completedAll, filledCount, total, pct, elapsed, rec){
  const overlay = document.getElementById('end-overlay');
  const L = SYSTEMS[testState.sys].lines[testState.lineId];
  document.getElementById('eo-emoji').textContent = completedAll ? '🎉' : '⏱️';
  document.getElementById('eo-title').textContent = completedAll
    ? ('You memorized the '+L.name+' line!')
    : 'Round ended';
  document.getElementById('eo-time').innerHTML = 'Time: <b>'+fmtTime(elapsed)+'</b>';
  document.getElementById('eo-pct').innerHTML = 'Completed: <b>'+filledCount+' / '+total+' ('+pct+'%)</b>';
  overlay.classList.add('active');
  document.getElementById('eo-done').onclick = ()=>{
    overlay.classList.remove('active');
    location.hash = '#/line/'+testState.sys+'/'+testState.lineId;
  };
  document.getElementById('eo-retry').onclick = ()=>{
    overlay.classList.remove('active');
    startTest(testState.sys, testState.lineId);
  };
}

/* ============ PROGRESS ============ */
function renderProgress(sys){
  const S = SYSTEMS[sys];
  document.getElementById('progress-title').textContent = S.name+' Progress';
  const stats = overallStats(sys);
  document.getElementById('prog-overall-pct').textContent = stats.pct+'%';
  document.getElementById('prog-overall-sub').textContent = stats.done+' / '+stats.total+' stops memorized';
  const list = document.getElementById('prog-list');
  list.innerHTML='';
  S.order.forEach(id=>{
    const L = S.lines[id];
    const rec = getLineRecord(sys, id);
    const total = lineStopCount(sys, id);
    const row = el('div','pl-row');
    const b = el('div','bullet',L.name);
    b.style.background=L.color; b.style.color=L.textColor;
    if(L.name.length > 1) b.style.fontSize = '50%';
    row.appendChild(b);
    const info = el('div','pl-info');
    info.appendChild(el('div','pl-name', L.fullName ? (L.name+' · '+L.fullName) : (L.name+' Train')));
    const sub = rec.completed
      ? ('Best time: '+fmtTime(rec.bestTime))
      : (rec.bestFilled>0 ? ('Best: '+rec.bestFilled+' / '+total+' stops') : 'Not started');
    info.appendChild(el('div','pl-sub', sub));
    row.appendChild(info);
    const status = el('div', rec.completed? 'pl-status done':'pl-status', rec.completed? '✓ Done':(rec.bestFilled>0?Math.round(rec.bestFilled/total*100)+'%':'—'));
    row.appendChild(status);
    row.onclick = ()=>{ location.hash = '#/line/'+sys+'/'+id; };
    list.appendChild(row);
  });
  document.getElementById('progress-back-btn').onclick = ()=>{ location.hash = '#/lines/'+sys; };
}

/* ============ init ============ */
route();

/* register service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

</script>
